
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Order Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Manufacturing Traceability System</h1>
        <p>Smart Production & Quality Monitoring</p>
    </header>

    <main class="main-content">
        <h2>Production Order Management</h2>
        <p>Monitor production orders and their manufacturing status.</p>

        <table>
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Product ID</th>
                    <th>Quantity</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="production-orders-table">
                <tr>
                    <td colspan="4">Loading production orders...</td>
                </tr>
            </tbody>
        </table>

        <p><a href="index.html">Back to Dashboard</a></p>
    </main>

    <script src="production_orders.js"></script>
</body>
</html>
